services:
  c2:
    build: .
    container_name: shadowc2
    stdin_open: true
    tty: true
    ports:
      - "8443:8443"
      - "443:443"
    volumes:
      - ./certs:/app/certs
      - c2-data:/data
    environment:
      - C2_AUTH_TOKEN=${C2_AUTH_TOKEN:-}
      - C2_PLAIN_PORT=8443
      - C2_TLS_PORT=443
      - DATA_DIR=/data
    restart: unless-stopped

  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: shadowc2-files
    ports:
      - "8880:80"
    volumes:
      - c2-data:/srv
      - ./filebrowser.json:/config/settings.json:ro
    command: >
      --username=shadow
      --password=$$2a$$10$$BEHPzX8ZRwiCO.aR5pNAKOJfQn4Qv02ZfNC4e9lwi9rY.lWtQxTvC
    restart: unless-stopped
    profiles:
      - tools

volumes:
  c2-data:
    name: shadowc2-data
